name: Lint Backend

on: [push, pull_request]

jobs:
  lint-java:
    runs-on: ubuntu-latest
    name: Checkstyle Java Linting
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Checkstyle
        run: curl -L -o checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar

      # Uses the Google ruleset bundled in the jar; violations are reported without failing the build (|| true)
      - name: Run Checkstyle
        run: java -jar checkstyle.jar -c /google_checks.xml app/src/main/java/com/project/back_end || true
